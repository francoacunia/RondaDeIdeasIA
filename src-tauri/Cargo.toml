[package]
name = "ronda-de-ideas-ia"
version = "0.1.0"
description = "Dashboard local de debate multi-agente (Ronda de ideas IA)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
